<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Assistente Virtual</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050b1a;color:#c8ecff;font-family:'Courier New',monospace;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px}
  h1{color:#19b8ff;font-size:19px;letter-spacing:4px}
  .sub{color:#5f7ea0;font-size:11px;margin:4px 0 18px}
  .anel{position:relative;width:160px;height:160px;margin-bottom:6px}
  .ext{position:absolute;inset:0;border-radius:50%;border:3px solid #19b8ff;animation:pulso 2s infinite}
  .int{position:absolute;inset:11px;border-radius:50%;border:1px dashed rgba(25,184,255,.4);animation:girar 12s linear infinite}
  .nuc{position:absolute;inset:49px;border-radius:50%;background:#19b8ff;display:flex;align-items:center;
       justify-content:center;color:#050b1a;font-weight:bold;font-size:11px;box-shadow:0 0 30px #19b8ff88}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(25,184,255,.5)}50%{box-shadow:0 0 0 15px rgba(25,184,255,0)}}
  @keyframes girar{to{transform:rotate(360deg)}}
  .status{color:#19b8ff;font-size:11px;letter-spacing:2px;margin-bottom:14px}
  #chat{width:100%;max-width:440px;background:#0a1630;border:1px solid #123;border-radius:12px;
        padding:13px;height:270px;overflow-y:auto;font-size:13px}
  #chat div{margin-bottom:8px;line-height:1.55;animation:aparecer .35s}
  .j{color:#19b8ff}.v{color:#c8ecff;text-align:right}
  @keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .controles{width:100%;max-width:440px;margin-top:13px}
  input{width:100%;background:#0a1630;border:1px solid #123;color:#c8ecff;padding:11px 13px;
        border-radius:8px;font-family:inherit;font-size:13px}
  .botoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
  button{background:#0a3a5c;color:#c8ecff;border:none;padding:10px;border-radius:8px;
         font-family:inherit;font-size:11px;cursor:pointer}
  button:active{background:#19b8ff;color:#050b1a}
  .footer{margin-top:18px;color:#3a5578;font-size:10px;text-align:center}
</style>
</head>
<body>

<h1>J.A.R.V.I.S.</h1>
<div class="sub">Just A Rather Very Intelligent System</div>

<div class="anel"><div class="ext"></div><div class="int"></div><div class="nuc">JARVIS</div></div>
<div class="status" id="status">TOQUE EM 🎙️ E DIGA "JARVIS"</div>

<div id="chat"></div>

<div class="controles">
  <input id="cmd" placeholder="Ou digite aqui... (ex: notícias)">
  <div class="botoes">
    <button onclick="falarCmd('que horas são')">🕐 Horas</button>
    <button onclick="falarCmd('notícias virais do brasil')">🔥 Virais no BR</button>
    <button onclick="ativarVoz()">🎙️ Falar</button>
    <button onclick="falarCmd('me conta uma piada')">😂 Piada</button>
    <button onclick="falarCmd('qual é a data de hoje')">📅 Data</button>
    <button onclick="falarCmd('quem é você')">🤖 Sobre</button>
  </div>
</div>

<div class="footer">🤖 JARVIS v4 — assistente de voz • sem API key</div>

<script>
const chat = document.getElementById('chat');
const statusEl = document.getElementById('status');
const temVoz = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;

function add(cls, txt){
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = txt;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function falarJ(txt){
  add('j', 'JARVIS: ' + txt);
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'pt-BR'; u.rate = 1.05;
  speechSynthesis.speak(u);
}

const piadas = [
  'Por que o JavaScript foi ao terapeuta? Muitos callbacks não resolvidos.',
  'O que o zero disse para o oito? Belo cinto!',
  'Por que o Wi-Fi terminou com o fio? Precisava de espaço.'
];

async function noticiasVirias(){
  falarJ('Consultando os feeds de notícias do Brasil...');
  try{
    const rss = 'https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-419';
    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(rss));
    const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
    const itens = [...xml.querySelectorAll('item')].slice(0, 5);
    if(!itens.length) throw 0;
    falarJ('O que está bombando no Brasil agora, senhor:');
    itens.forEach((it, i) => setTimeout(() =>
      add('j', '🔥 ' + it.querySelector('title').textContent), 500*(i+1)));
  }catch(e){
    falarJ('Sem acesso aos feeds agora, senhor. Mas garanto que a tecnologia está em alta.');
  }
}

function responder(txt){
  const t = txt.toLowerCase();
  add('v', 'Você: ' + txt);
  if(/jarvis/.test(t) && t.length < 15){
    falarJ('Sim, senhor? Estou ouvindo.');
  } else if(/hora/.test(t)){
    falarJ('São ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) + ', senhor.');
  } else if(/data|dia é hoje/.test(t)){
    falarJ('Hoje é ' + new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) + '.');
  } else if(/viral|notícia|noticia|bombando/.test(t)){
    noticiasVirias();
  } else if(/piada/.test(t)){
    falarJ(piadas[Math.floor(Math.random()*piadas.length)]);
  } else if(/clima|temperatura/.test(t)){
    falarJ('Não tenho sensores meteorológicos nesta versão web, senhor. Mas é uma ótima noite para programar.');
  } else if(/quem é você|seu nome|sobre/.test(t)){
    falarJ('Sou o JARVIS — Just A Rather Very Intelligent System. Assistente pessoal às suas ordens, Chefe.');
  } else if(/desligar|tchau|sair/.test(t)){
    falarJ('Até logo, senhor. Desligando sistemas.');
  } else {
    falarJ('Interessante, senhor. Pode pedir notícias, horas, data, piada ou perguntar quem sou eu.');
  }
}

let rec = null;
function ativarVoz(){
  if(!temVoz){ falarJ('Seu navegador não suporta reconhecimento de voz. Use o teclado, senhor.'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = false;
  statusEl.textContent = '🎙️ OUVINDO...';
  rec.onresult = e => {
    const txt = e.results[0][0].transcript;
    statusEl.textContent = 'SISTEMAS ONLINE';
    responder(txt);
  };
  rec.onerror = () => { statusEl.textContent = 'ERRO NO MICROFONE — use o teclado'; };
  rec.onend = () => { if(statusEl.textContent.includes('OUVINDO')) statusEl.textContent='SISTEMAS ONLINE'; };
  rec.start();
}

function falarCmd(c){ responder(c); }
document.getElementById('cmd').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.value.trim()){ responder(e.target.value); e.target.value=''; }
});

add('j','JARVIS: Sistemas online, senhor. Toque em 🎙️ e fale comigo, ou use os botões abaixo.');
</script>

</body>
</html>
